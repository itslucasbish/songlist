<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Catálogo de Just Dance">
    <title>Just Dance - Catálogo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <div id="loadingSection" aria-live="polite" aria-busy="true">
            <div class="spinner" role="status" aria-label="Carregando"></div>
            <div>Carregando Catálogo...</div>
        </div>

        <main id="mainApp" class="hidden">
            <header class="header">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Alternar tema">🌙</button>
                <div class="header-content">
                    <h1>🎵 Just Dance Catálogo</h1>
                    <div class="header-stats">
                        <div class="stat">
                            <div class="stat-num" id="totalMusics">0</div>
                            <div class="stat-label">Músicas</div>
                        </div>
                        <div class="stat">
                            <div class="stat-num" id="uniqueGames">0</div>
                            <div class="stat-label">Jogos</div>
                        </div>
                    </div>
                </div>
            </header>

            <nav class="tabs" role="tablist" aria-label="Navegação do catálogo">
                <button type="button" class="tab-btn active" id="tabTrending" role="tab"
                        aria-selected="true" aria-controls="catalogPanel">🔥 Recomendações</button>
                <button type="button" class="tab-btn" id="tabLibrary" role="tab"
                        aria-selected="false" aria-controls="catalogPanel">📚 Biblioteca</button>
            </nav>

            <div id="catalogPanel" role="tabpanel" aria-labelledby="tabTrending">
                <div id="weightControls" class="dashboard-controls">
                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="sp-label">Peso Spotify</span>
                            <span id="valSp" class="weight-badge">1</span>
                        </div>
                        <input type="range" id="weightSp" min="0" max="10" step="0.5" value="1"
                               aria-label="Peso do ranking Spotify">
                    </div>
                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="yt-label">Peso YouTube</span>
                            <span id="valYt" class="weight-badge yt-badge">2</span>
                        </div>
                        <input type="range" id="weightYt" min="0" max="10" step="0.5" value="2"
                               aria-label="Peso do ranking YouTube">
                    </div>
                </div>

                <section class="filters-section" aria-label="Filtros de busca">
                    <div class="filters-grid">
                        <div class="filter-group search-full">
                            <label for="searchGeneral">🔍 Pesquisar</label>
                            <input type="search" id="searchGeneral" placeholder="Nome, artista..." autocomplete="off">
                        </div>
                        <div class="filter-group">
                            <label for="filterGenre">Gênero</label>
                            <select id="filterGenre"></select>
                        </div>
                        <div class="filter-group">
                            <label for="filterDecade">Década</label>
                            <select id="filterDecade"></select>
                        </div>
                        <div class="filter-group">
                            <label for="filterGame">Jogos</label>
                            <select id="filterGame"></select>
                        </div>
                        <div class="filter-group">
                            <label for="filterPlayers">Dançarinos</label>
                            <select id="filterPlayers"></select>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button type="button" class="btn-reset" id="btnResetFilters">↻ Limpar</button>
                    </div>
                </section>

                <p class="results-info" aria-live="polite">
                    Exibindo <strong id="resultCount">0</strong> músicas
                </p>
                <div class="music-grid" id="musicGrid"></div>
            </div>
        </main>
    </div>

    <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalArtist">
        <div class="modal-content" id="modalContentBox">
            <div class="modal-header">
                <div class="modal-header-info">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <p class="modal-artist" id="modalArtist"></p>
                </div>
                <button type="button" class="modal-close" id="modalClose" aria-label="Fechar prévia">✕</button>
            </div>
            <div class="modal-body">
                <div class="video-container" id="vidContainer">
                    <div id="bufferLoading" class="buffer-loading" role="status" aria-live="polite">Sincronizando...</div>
                    <video id="modalVideoPlayer" controls preload="metadata"></video>
                </div>
                <div class="modal-tags" id="modalTags"></div>
            </div>
        </div>
    </div>
    <audio id="modalAudioPlayer" preload="metadata"></audio>

    <script src="app.js"></script>
</body>
</html>
